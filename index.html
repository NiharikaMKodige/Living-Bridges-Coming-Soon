<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111719">
  <title>Living Bridges | Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="landing">
    <div class="background" aria-hidden="true"></div>
    <div class="shade" aria-hidden="true"></div>

    <section class="content" aria-labelledby="brand-name">
      <h1 id="brand-name">Living Bridges</h1>
      <span class="gold-line" aria-hidden="true"></span>
      <p class="coming-soon">COMING SOON</p>
      <div class="tagline">
        <span class="gold-dot" aria-hidden="true"></span>
        <p id="tagline-text">Something good is on its way.</p>
      </div>

      <form class="notify-form" id="notify-form">
        <label class="visually-hidden" for="email">Your email address</label>
        <input id="email" name="email" type="email" placeholder="Your email address" autocomplete="email" required>
        <button type="submit">Notify me</button>
      </form>
      <p class="form-message" id="form-message" aria-live="polite"></p>
    </section>

    <footer>© 2026 Living Bridges. All rights reserved.</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
